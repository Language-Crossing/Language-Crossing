name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change to master if your default branch is master

# Sets permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Godot Web
        id: export
        uses: firebelley/godot-export@v5.2.1
        with:
          # Download links for the Godot headless runner and templates
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Targets the 'Web' preset output directory
          path: ${{ steps.export.outputs.build_directory }}/Web 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
